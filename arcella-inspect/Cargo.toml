[package]
name = "arcella-inspect"
version = "0.1.3"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Static analysis of Rust code to extract structured metadata (functions, structs, calls) as YAML or structured data."
keywords = ["rust", "analysis", "ast", "metadata", "inspect"]
categories = ["development-tools", "parsing"]

[lib]
name = "arcella_inspect"
path = "src/lib.rs"

[[bin]]
name = "arc-inspect"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
syn = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }

